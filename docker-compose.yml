services:
  random-fitness:
    build: .
    container_name: random-fitness
    ports:
      - "7703:7703"
    environment:
      PORT: 7703
      BOT_TOKEN: ${BOT_TOKEN:-}
      JWT_SECRET: ${JWT_SECRET:-please-change-this-secret}
      DB_PATH: /app/data/app.db
      ADMIN_USERS: ${ADMIN_USERS:-}
      ADMIN_TELEGRAM_IDS: ${ADMIN_TELEGRAM_IDS:-}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

